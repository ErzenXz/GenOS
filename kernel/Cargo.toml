[package]
name = "kernel"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[lib]
path = "src/lib.rs"

[dependencies]
genos_abi.workspace = true

[features]
default = []
# Run deterministic boot proof suites; normal images omit all stress execution.
validation-boot = []
# Enables deterministic, bounded packet fault injection used only by the
# `cargo xtask test-network` QEMU acceptance gate. Production images never
# compile the trigger payloads or deliberate packet delay/drop paths.
network-test-faults = ["validation-boot"]
# Explicit validation images only: inject failures before physical allocation.
memory-test-faults = ["validation-boot"]
