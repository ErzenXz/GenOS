name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, docs/quality-first-roadmap]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Activate pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add x86_64-unknown-none x86_64-unknown-uefi
          rustup component add clippy rustfmt
          rustc -Vv
          cargo -V

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path tools/parser-stress/Cargo.toml -- --check

      - name: Lint host-side ABI and build tooling
        run: |
          cargo clippy -p genos_abi -- -D warnings
          cargo clippy -p xtask -- -D warnings
          cargo clippy --manifest-path tools/parser-stress/Cargo.toml --all-targets --offline -- -D warnings

      - name: Lint UEFI bootloader
        run: cargo clippy -p bootloader --target x86_64-unknown-uefi -- -D warnings

      - name: Lint complete kernel
        run: |
          cargo clippy -p kernel --lib -- -D warnings
          cargo clippy -p kernel --bin kernel --target x86_64-unknown-none -- -D warnings
          cargo clippy -p kernel --bin kernel --target x86_64-unknown-none --features validation-boot,memory-test-faults,network-test-faults -- -D warnings

      - name: Lint userspace targets
        run: |
          cargo clippy -p genos-user-runtime --target x86_64-unknown-none -- -D warnings
          cargo clippy -p genos-init --profile userspace --target x86_64-unknown-none -- -D warnings
          cargo clippy -p genos-shell --profile userspace --target x86_64-unknown-none -- -D warnings
          cargo clippy -p genos-shell --profile userspace --target x86_64-unknown-none --features validation-boot -- -D warnings

  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Activate pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add x86_64-unknown-none x86_64-unknown-uefi
          rustc -Vv
          cargo -V

      - name: Run workspace tests
        run: |
          cargo test --workspace
          cargo test --manifest-path tools/parser-stress/Cargo.toml --offline
          python3 -m unittest discover -s tools -p 'test_*.py'

  release-checks:
    name: Release target checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Activate pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add x86_64-unknown-none x86_64-unknown-uefi
          rustc -Vv
          cargo -V

      - name: Check release bootloader and kernel targets
        run: |
          cargo check -p bootloader --release --target x86_64-unknown-uefi
          cargo check -p kernel --release --target x86_64-unknown-none

      - name: Check userspace release profile
        run: |
          cargo check -p genos-user-runtime --profile userspace --target x86_64-unknown-none
          cargo check -p genos-init --profile userspace --target x86_64-unknown-none
          cargo check -p genos-shell --profile userspace --target x86_64-unknown-none

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate repository-local Markdown links
        run: python3 tools/check_docs.py

  build-and-boot:
    name: Build and boot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes mtools ovmf qemu-system-x86

      - name: Activate pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add x86_64-unknown-none x86_64-unknown-uefi
          rustc -Vv
          cargo -V

      - name: Build image and run multi-phase QEMU suite
        run: make test

      - name: Write CI evidence manifest
        if: always()
        shell: bash
        run: |
          mkdir -p build
          {
            echo "commit=${GITHUB_SHA}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            rustc -Vv || true
            cargo -V || true
            qemu-system-x86_64 --version | head -n 1 || true
            dpkg-query -W -f='${Package}=${Version}\n' ovmf qemu-system-x86 mtools 2>/dev/null || true
            if [[ -f build/genos.img ]]; then
              sha256sum build/genos.img
            else
              echo "build/genos.img missing"
            fi
            echo "build files:"
            find build -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          } > build/ci-manifest.txt

      - name: Upload QEMU evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: genos-qemu-evidence
          path: |
            build/ci-manifest.txt
            build/serial*.log
          if-no-files-found: warn
          retention-days: 14

  unsafe-inventory:
    name: Unsafe source inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check retained source and review context
        run: python3 tools/check_unsafe.py --check
      - name: Retain current inventory for review
        if: always()
        run: |
          mkdir -p build
          python3 tools/check_unsafe.py --json > build/unsafe-inventory.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unsafe-inventory
          path: build/unsafe-inventory.json
          retention-days: 14

  parser-stress:
    name: Parser mutation stress (${{ matrix.seed }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        seed: ['0', '0x47454e4f53']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run production parsers and socket invariants
        shell: bash
        run: |
          mkdir -p build
          cargo run --manifest-path tools/parser-stress/Cargo.toml --release --offline -- --seed ${{ matrix.seed }} --iterations 100000 2>&1 | tee build/parser-stress.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parser-stress-${{ matrix.seed }}
          path: |
            build/parser-stress.log
            tools/parser-stress/target/failures/
          retention-days: 14

  normal-boot:
    name: Normal debug and release boot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install reference VM dependencies
        run: sudo apt-get update && sudo apt-get install --yes mtools ovmf qemu-system-x86
      - name: Exercise the real shell without validation startup
        run: cargo xtask test-release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: normal-boot-evidence
          path: |
            build/serial-normal-debug.log
            build/serial-release.log
            build/image-mode.txt
            build/normal-*-manifest.txt
            build/normal-*-qemu.log
          retention-days: 14

  bsp-admission:
    name: Single-core admission
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install reference VM dependencies
        run: sudo apt-get update && sudo apt-get install --yes mtools ovmf qemu-system-x86
      - name: Prove BSP boots and rejected reentry
        run: python3 tools/test_bsp.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bsp-admission-evidence
          path: build/bsp-evidence/
          retention-days: 14

  boot-memory-admission:
    name: Boot memory admission (${{ matrix.case }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case: [loader-version, count, overlap, initrd-usable, kernel-usable, cmdline]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Distribution QEMU/OVMF supplies portability evidence. Each manifest
      # records its actual identity; this is not reference qualification.
      - name: Install developer VM dependencies
        run: sudo apt-get update && sudo apt-get install --yes mtools ovmf qemu-system-x86
      - name: Check boot-memory evidence and fixture regressions
        run: python3 -m unittest discover -s tools -p 'test_boot_memory_harness.py'
      - name: Reject the malformed handoff before kernel initialization
        shell: bash
        run: |
          mkdir -p build
          python3 tools/test_boot_memory.py --case "${{ matrix.case }}" 2>&1 | tee build/boot-memory-run.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boot-memory-${{ matrix.case }}-evidence
          path: |
            build/boot-memory-run.log
            build/boot-memory-evidence/
          if-no-files-found: warn
          retention-days: 14
