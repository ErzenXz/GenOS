[workspace]
members = [
    "crates/abi",
    "bootloader",
    "kernel",
    "userspace/runtime",
    "userspace/init",
    "userspace/shell",
    "tools/xtask",
]
resolver = "2"

[workspace.package]
rust-version = "1.97"
edition = "2021"
license = "MIT"
authors = ["GenOS"]

[workspace.dependencies]
genos_abi = { path = "crates/abi" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# The precompiled x86_64 core uses a different code model from our large-model
# kernel. Cross-crate LTO cannot merge their LLVM module flags on stable Rust.
lto = false
codegen-units = 1

[profile.userspace]
inherits = "release"
panic = "abort"
lto = false
codegen-units = 1
