[package]
name = "genos-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[[bin]]
name = "genos-shell"
path = "src/main.rs"
test = false
bench = false

[dependencies]
genos-user-runtime = { path = "../runtime" }

[features]
default = []
# Startup self-tests are available only in explicitly built validation images.
validation-boot = []
